      </div>
      <p className="text-center text-xs text-indigo-200/60 mt-3">{note||(diary.ai?"AI가 나의 글투로 썼어요 · 고치면 글투를 더 배워요":"AI 연결이 어려워 기본 문장으로 엮었어요")}</p>
      <div className="mt-4 flex flex-col gap-3">
       {ed
        ?<button onClick={saveEdit} style={{"--c":m.c}} className="glass chip on rounded-full py-4 font-semibold">저장하고 글투 배우기</button>
        :<button onClick={()=>{setEtxt(diary.paras.join("\n\n"));setEd(true)}} className="glass chip rounded-full py-3 text-sm flex items-center justify-center gap-1.5"><Ic n="pencil"/>내 말로 고치기</button>}
       <button onClick={()=>setView("house")} style={{"--c":m.c}} className="glass chip on rounded-full py-4 font-semibold">우리 집으로 돌아가기</button>
       <button onClick={()=>setView("home")} className="glass chip rounded-full py-3 text-sm">마을로 나가기</button>
      </div>
     </div>
    )})()}
   </div>
  </div>
 );
}
class EB extends React.Component{
 constructor(p){super(p);this.state={e:null}}
 static getDerivedStateFromError(e){return{e}}
 render(){return this.state.e?<div className="bg p-6 text-sm"><p>화면을 그리다 문제가 생겼어요.</p><pre className="whitespace-pre-wrap text-xs opacity-70 mt-2">{String(this.state.e)}</pre><button onClick={()=>{try{localStorage.removeItem("hj_houses")}catch(e){}location.reload()}} className="glass rounded-full px-5 py-2 mt-4">초기화하고 다시 시작</button></div>:this.props.children}
}
ReactDOM.createRoot(document.getElementById("root")).render(<EB><App/></EB>);
</script>
</body>
</html>
